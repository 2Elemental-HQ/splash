name: Splash Manager

# The macOS app in app/, the runtime it bundles, and the drain patch in the Splash server.
# Needs no model, no Keychain secret, no signing identity. Upstream workflows are untouched; its
# "Splash runtime CI" also runs the whole Python suite on every pull request, this adds fast feedback.
on:
  push:
    paths:
      - "app/**"
      - "server/**"
      - "install/**"
      - "dev/tests/server/**"
      - "install/requirements.txt"
      - "dev/requirements.txt"
      - ".github/workflows/splash-manager.yml"
  pull_request:
    paths:
      - "app/**"
      - "server/**"
      - "install/**"
      - "dev/tests/server/**"
      - "dev/requirements.txt"
      - ".github/workflows/splash-manager.yml"

permissions:
  contents: read

jobs:
  drain-patch:
    name: Splash server drain patch (Python)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            dev/requirements.txt
      - name: Install the server's dependencies
        run: python -m pip install -r install/requirements.txt -r dev/requirements.txt
      - name: Drain, signal handling, HTTP admission and transport tests
        run: >-
          python -m unittest -v
          dev.tests.server.test_drain
          dev.tests.server.test_server_main
          dev.tests.server.test_http_transport
          dev.tests.server.test_http_body_budget
          dev.tests.server.test_server_recovery
      - name: Style of the touched Python
        run: |
          python -m ruff check --config dev/ruff.toml server dev/tests/server/test_drain.py dev/tests/server/test_server_main.py
          python -m ruff format --check --config dev/ruff.toml server dev/tests/server/test_drain.py dev/tests/server/test_server_main.py

  app:
    name: App, bundled runtime and release gate
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Unit and process tests
        working-directory: app
        run: swift test
      - uses: actions/cache@v4
        with:
          path: app/release/cache
          key: splash-upstream-runtime-${{ hashFiles('app/release/runtime/UPSTREAM.json') }}
      - name: Development build with the bundled runtime (unsigned layout), disk image layout
        working-directory: app
        env:
          SIGN_IDENTITY: "-"   # ad hoc: CI never signs for distribution
          WITH_RUNTIME: "1"
        run: ./build-dev.sh --dmg
      - name: The bundled runtime verifies and launches
        working-directory: app
        run: |
          app="build/Splash Manager.app"
          "$app/Contents/MacOS/SplashManager" --verify-runtime
          "$app/Contents/Resources/Splash/bin/splash" --version | grep -q "1.3.0-drain.1"
          grep -q SIGUSR1 "$app/Contents/Resources/Splash/server/server.py"
      - name: Release script refuses without a Developer ID identity
        working-directory: app
        run: |
          if release/build-release.sh --check; then echo "release preflight must fail on CI"; exit 1; fi
